      --verde: #0d4f3c;
      --verde-claro: #e8f5f0;
      --verde-medio: #1a6b52;

      --gris-bg: #f7f7f5;
      --gris-borde: #e2e2de;
      --gris-texto: #6b6b68;
      --rojo: #c0392b;
      --azul: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--gris-bg);
      color: #1a1a18;
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: var(--verde);
      color: white;
      padding: 2.5rem 2rem 2rem;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin-bottom: 0.5rem;
    }
    .header h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }
    .header-subtitle {
      font-size: 0.875rem;
      color: rgba(255,255,255,0.65);
      font-weight: 400;
    }

    /* STATS BAR */
    .stats-bar {
      background: white;
      border-bottom: 1px solid var(--gris-borde);
      padding: 1rem 2rem;
    }
    .stats-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 2.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .stat-num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--verde);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gris-texto);
    }
    .stat-divider {
      width: 1px;
      height: 36px;
      background: var(--gris-borde);
    }
    .last-update {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--gris-texto);
    }

    /* MAIN */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
    }

    /* FILTERS */
    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
      align-items: center;
    }
    .filter-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gris-texto);
      margin-right: 0.25rem;
    }
    .filter-pill {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      border: 1.5px solid var(--gris-borde);
      background: white;
      font-size: 0.78rem;
      font-weight: 500;
      color: #444;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-pill:hover { border-color: var(--verde-medio); color: var(--verde-medio); }
    .filter-pill.active {
      background: var(--verde);
      border-color: var(--verde);
      color: white;
    }

    /* SEARCH */
    .search-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gris-texto);
      font-size: 0.9rem;
    }
    #search {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.5rem;
      border: 1.5px solid var(--gris-borde);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      background: white;
      outline: none;
      transition: border-color 0.15s;
    }
    #search:focus { border-color: var(--verde-medio); }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.25rem;
    }

    /* CARD */
    .card {
      background: white;
      border: 1.5px solid var(--gris-borde);
      border-radius: 12px;
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover {
      box-shadow: 0 8px 24px rgba(13,79,60,0.1);
      transform: translateY(-2px);
    }
    .card-header {
      padding: 1.25rem 1.25rem 0.9rem;
      border-bottom: 1px solid var(--gris-borde);
    }
    .card-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .badge-sector {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      background: var(--verde-claro);
      color: var(--verde);
    }
    .badge-fecha {
      font-size: 0.65rem;
      color: var(--gris-texto);
      font-weight: 400;
    }
    .card h2 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: #1a1a18;
      line-height: 1.3;
    }
    .card-body {
      padding: 1rem 1.25rem;
    }
    .card-desc {
      font-size: 0.82rem;
      color: #444;
      line-height: 1.6;
      margin-bottom: 0.9rem;
    }
    .fit-box {
      background: var(--verde-claro);
      border-left: 3px solid var(--verde);
      border-radius: 0 6px 6px 0;
      padding: 0.6rem 0.8rem;
      font-size: 0.78rem;
      color: var(--verde-medio);
      line-height: 1.5;
      margin-bottom: 1rem;
    }
    .fit-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--verde);
      margin-bottom: 0.2rem;
    }

    /* DECISOR */
    .decisor-block {
      padding: 0.75rem;
      background: #fafaf8;
      border: 1px solid var(--gris-borde);
      border-radius: 8px;
      margin-bottom: 0.9rem;
    }
    .decisor-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gris-texto);
      margin-bottom: 0.4rem;

      font-size: 0.9rem;
      font-weight: 600;
      color: #1a1a18;
    }

      font-size: 0.76rem;
      color: var(--gris-texto);
      margin-top: 0.1rem;
    }

      gap: 0.5rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.6rem;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.15s;
    }

      background: #e8f0fe;
      color: #1d4ed8;
    }

      background: #f0f0ee;
      color: #555;
    }
    .link-web:hover { background: #555; color: white; }
    .no-link {
      font-size: 0.7rem;
      color: #aaa;
      font-style: italic;
    }

    .mensaje-block {
      margin-top: 0.75rem;

      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--verde-medio);
      cursor: pointer;
      user-select: none;
      margin-bottom: 0.4rem;

      display: none;
      font-size: 0.8rem;
      line-height: 1.65;
      color: #333;
      background: #f7f7f5;

      border-radius: 7px;
      padding: 0.7rem 0.85rem;
      position: relative;

      top: 0.4rem;
      right: 0.5rem;
      font-size: 0.65rem;
      padding: 0.15rem 0.5rem;

      border: none;
      border-radius: 4px;

      font-family: 'Inter', sans-serif;
      font-weight: 500;

      justify-content: space-between;

      font-weight: 600;

      padding: 0.2rem 0.6rem;

      font-size: 0.68rem;
      color: var(--gris-texto);

      text-align: center;
      padding: 4rem 2rem;
      color: var(--gris-texto);

      text-align: center;
      padding: 2rem;
      font-size: 0.75rem;
      color: var(--gris-texto);
      border-top: 1px solid var(--gris-borde);
      background: white;
    }

      .stats-inner { gap: 1.25rem; }
      .main { padding: 1.25rem 1rem 3rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

// ─── Estado dinámico (en memoria, no persiste entre visitas) ───
const estadoMap = {};

function getEstado(empresa) {
  return estadoMap[empresa] || PROSPECTS.find(p => p.empresa === empresa)?.estado || 'Pendiente';
}

function formatFecha(str) {
  if (!str) return '';
  const [y, m, d] = str.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
}

function getEstadoClass(estado) {
  if (!estado) return 'estado-default';
  const e = estado.toLowerCase();
  if (e.includes('pendiente')) return 'estado-Pendiente';
  if (e.includes('contactado')) return 'estado-Contactado';
  if (e.includes('nofit') || e.includes('no fit')) return 'estado-NoFit';
  if (e.includes('meeting')) return 'estado-Meeting';
  return 'estado-default';
}

function renderCard(p) {
  const estado = getEstado(p.empresa);
  const li = p.linkedin && p.linkedin.startsWith('http') ? p.linkedin : null;
  const liBtn = li ? `<a class="link-btn link-linkedin" href="${li}" target="_blank">💼 LinkedIn</a>` : '';
  const webDomain = p.empresa.toLowerCase().replace(/[^a-z0-9]/g, '') + '.com';

  return `
  <article class="card" data-empresa="${p.empresa}" data-sector="${p.sector}">
    <div class="card-header">
      <div class="card-meta">
        <span class="badge-sector">${p.sector.split('/')[0].trim()}</span>
        <span class="badge-fecha">${formatFecha(p.fecha)}</span>
      </div>
      <h2>${p.empresa}</h2>
    </div>
    <div class="card-body">
      <p class="card-desc">${p.descripcion}</p>
      <div class="fit-box">
        <div class="fit-label">Por qué fit</div>
        ${p.porQueFit}
      </div>
      <div class="decisor-block">
        <div class="decisor-label">Decisor</div>
        <div class="decisor-name">${p.decisor}</div>
        <div class="decisor-cargo">${p.cargo}</div>
        <div class="decisor-links">
          ${liBtn}
          ${!li ? '<span class="no-link">LinkedIn no encontrado</span>' : ''}
        </div>
      </div>
      <div class="mensaje-block">
        <div class="mensaje-toggle" onclick="toggleMsg(this)">
          <span class="toggle-arrow">▶</span> Ver mensaje personalizado
        </div>
        <div class="mensaje-text">
          <button class="copy-btn" onclick="copyMsg(this)">Copiar</button>
          ${p.mensaje}
        </div>
      </div>
    </div>
    <div class="estado-row">
      <span class="estado-badge ${getEstadoClass(estado)}">${estado}</span>
      <span class="card-date-small">${formatFecha(p.fecha)}</span>
    </div>
  </article>`;
}

function toggleMsg(el) {
  const arrow = el.querySelector('.toggle-arrow');
  const txt = el.nextElementSibling;
  txt.classList.toggle('open');
  arrow.textContent = txt.classList.contains('open') ? '▼' : '▶';
}

function copyMsg(btn) {
  const txt = btn.parentElement.textContent.replace('Copiar','').trim();
  navigator.clipboard.writeText(txt).then(() => {
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = 'Copiar', 1800);
  });
}

// ─── Filtros y búsqueda ───
let activeFilter = 'all';
let searchQuery = '';

function getUniqueSectors() {
  const seen = new Set();
  return PROSPECTS.map(p => p.sector.split('/')[0].trim()).filter(s => {
    if (seen.has(s)) return false;
    seen.add(s); return true;
  });
}

function buildFilters() {
  const container = document.getElementById('filters');
  const sectors = getUniqueSectors();
  sectors.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'filter-pill';
    btn.dataset.filter = s;
    btn.textContent = s;
    btn.onclick = () => setFilter(s);
    container.appendChild(btn);
  });
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-pill').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const q = searchQuery.toLowerCase();
  const filtered = PROSPECTS.filter(p => {
    const sectorMatch = activeFilter === 'all' || p.sector.startsWith(activeFilter);
    const searchMatch = !q ||
      p.empresa.toLowerCase().includes(q) ||
      p.sector.toLowerCase().includes(q) ||
      p.decisor.toLowerCase().includes(q) ||
      p.descripcion.toLowerCase().includes(q);
    return sectorMatch && searchMatch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty"><h3>Sin resultados</h3><p>Intenta con otro filtro o búsqueda.</p></div>`;
  } else {
    grid.innerHTML = filtered.map(renderCard).join('');
  }
  updateStats();
}

function updateStats() {
  const total = PROSPECTS.length;
  const pendiente = PROSPECTS.filter(p => getEstado(p.empresa).toLowerCase().includes('pendiente')).length;
  const contactado = PROSPECTS.filter(p => getEstado(p.empresa).toLowerCase().includes('contactado')).length;
  const meeting = PROSPECTS.filter(p => getEstado(p.empresa).toLowerCase().includes('meeting')).length;
  document.getElementById('count-total').textContent = total;
  document.getElementById('count-pendiente').textContent = pendiente;
  document.getElementById('count-contactado').textContent = contactado;
  document.getElementById('count-meeting').textContent = meeting;
}

// ─── Init ───
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderGrid();
});

buildFilters();
renderGrid();
</script>

<style>
  :root {
    --green: #0d4f3c;
    --green-light: #e8f2ee;
    --green-mid: #1a6b52;
    --accent: #2ecc71;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f9fafb;
    --white: #ffffff;
    --badge-farm: #7c3aed;
    --badge-agro: #15803d;
    --badge-mfg: #b45309;
    --badge-retail: #0369a1;
    --badge-dist: #6d28d9;
    --badge-text: #be185d;
    --badge-const: #dc2626;
    --badge-other: #374151;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--green);
    color: white;
    padding: 28px 40px 24px;
    border-bottom: 3px solid var(--accent);
  }
  .header-inner { max-width: 1200px; margin: 0 auto; }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .brand-name { font-family: 'Instrument Serif', serif; font-size: 1.6rem; color: white; line-height: 1.2; }
  .brand-sub { font-size: 0.75rem; color: rgba(255,255,255,0.6); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .header-meta { text-align: right; }
  .last-update { font-size: 0.75rem; color: rgba(255,255,255,0.55); margin-bottom: 4px; }
  .header-url { font-size: 0.7rem; color: rgba(255,255,255,0.4); font-family: monospace; }

  /* STATS */
  .stats-bar {
    background: var(--green-mid);
    padding: 14px 40px;
  }
  .stats-inner { max-width: 1200px; margin: 0 auto; display: flex; gap: 32px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; }
  .stat-num { font-size: 1.5rem; font-weight: 700; color: white; line-height: 1; }
  .stat-label { font-size: 0.68rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  /* FILTERS */
  .filters-wrap {
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .filters-inner { max-width: 1200px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px; }
  .pill {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }
  .pill.all { background: var(--green); color: white; border-color: var(--green); }
  .pill.all.inactive { background: white; color: var(--green); border-color: var(--green); }
  .pill.sector-pill { background: var(--bg); color: var(--muted); border-color: var(--border); }
  .pill.sector-pill:hover { border-color: var(--green); color: var(--green); }
  .pill.sector-pill.active { background: var(--green-light); color: var(--green); border-color: var(--green); }

  /* SEARCH */
  .search-wrap { margin-left: auto; }
  .search-input {
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.78rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    width: 200px;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--green); }

  /* MAIN */
  .main { max-width: 1200px; margin: 0 auto; padding: 28px 40px 60px; }

  /* CARDS GRID */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.2s, transform 0.15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }

  .card-header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    background: white;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .card-fecha { font-size: 0.65rem; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
  .card-estado { font-size: 0.62rem; font-weight: 600; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
  .estado-pendiente { background: #fef9c3; color: #713f12; }
  .estado-contactado { background: #dcfce7; color: #14532d; }
  .estado-nofit { background: #fee2e2; color: #991b1b; }
  .estado-default { background: var(--bg); color: var(--muted); }

  .card-empresa { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  .sector-badge {
    display: inline-block;
    font-size: 0.62rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: white;
    background: var(--badge-other);
  }

  .card-body { padding: 14px 18px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .card-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
  .card-fit { font-size: 0.75rem; color: var(--text); line-height: 1.5; }
  .fit-label { font-size: 0.65rem; font-weight: 600; color: var(--green); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; }

  .card-divider { height: 1px; background: var(--border); }

  .decisor-block { display: flex; flex-direction: column; gap: 4px; }
  .decisor-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .decisor-cargo { font-size: 0.72rem; color: var(--muted); }
  .decisor-links { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
  .link-btn {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .link-li { background: #eef2ff; color: #3730a3; }
  .link-em { background: #f0fdf4; color: #15803d; }
  .no-link { font-size: 0.65rem; color: #d1d5db; font-style: italic; }

  .mensaje-block { background: var(--green-light); border-radius: 8px; padding: 10px 12px; }
  .mensaje-label { font-size: 0.62rem; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
  .mensaje-text { font-size: 0.75rem; color: #1a3d2f; line-height: 1.55; }

  .copy-btn {
    background: none;
    border: 1.5px solid var(--green);
    color: var(--green);
    font-size: 0.65rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    align-self: flex-end;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
  }
  .copy-btn:hover { background: var(--green); color: white; }
  .copy-btn.copied { background: var(--accent); border-color: var(--accent); color: white; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1 / -1; }
  .empty-state h3 { font-size: 1rem; margin-bottom: 8px; }
  .empty-state p { font-size: 0.8rem; }

  /* FOOTER */
  .footer { text-align: center; padding: 20px; font-size: 0.7rem; color: var(--muted); border-top: 1px solid var(--border); background: white; }

  @media (max-width: 640px) {
    .header, .stats-bar, .filters-wrap, .main { padding-left: 16px; padding-right: 16px; }
    .cards-grid { grid-template-columns: 1fr; }
    .stats-inner { gap: 20px; }
    .search-wrap { width: 100%; }
    .search-input { width: 100%; }
  }
</style>
</head>

// SECTOR COLORS
const SECTOR_COLORS = {
  'Farmacéutica': '#7c3aed',
  'Agroindustria': '#15803d',
  'Manufactura': '#b45309',
  'Retail': '#0369a1',
  'Distribución': '#6d28d9',
  'Textil': '#be185d',
  'Construcción': '#dc2626',
  'Alimentos': '#ca8a04',
  'Bebidas': '#0891b2',
  'default': '#374151'
};

function getSectorColor(sector) {
  for (const [key, color] of Object.entries(SECTOR_COLORS)) {
    if (sector && sector.includes(key)) return color;
  }
  return SECTOR_COLORS.default;
}

function getEstadoClass(estado) {
  if (!estado) return 'estado-default';
  if (estado.toLowerCase().includes('pendiente')) return 'estado-pendiente';
  if (estado.toLowerCase().includes('contactado')) return 'estado-contactado';
  if (estado.toLowerCase().includes('nofit') || estado.toLowerCase().includes('no fit')) return 'estado-nofit';
  return 'estado-default';
}

let activeSector = 'all';
let searchQuery = '';

function filterSector(sector) {
  activeSector = sector;
  document.getElementById('pill-all').classList.toggle('all', sector === 'all');
  document.getElementById('pill-all').classList.toggle('inactive', sector !== 'all');
  document.querySelectorAll('.sector-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.sector === sector);
  });
  renderCards();
}

function filterSearch(query) {
  searchQuery = query.toLowerCase();
  renderCards();
}

function buildSectorPills() {
  const sectors = [...new Set(PROSPECTS.map(p => {
    const s = p.sector || '';
    for (const key of Object.keys(SECTOR_COLORS)) {
      if (s.includes(key)) return key;
    }
    return s.split('/')[0].trim();
  }))].filter(Boolean).sort();

  const container = document.getElementById('sector-pills');
  container.innerHTML = sectors.map(s =>
    `<span class="pill sector-pill" data-sector="${s}" onclick="filterSector('${s}')">${s}</span>`
  ).join('');

  document.getElementById('stat-sectors').textContent = sectors.length;
}

function matchesSector(prospect, sector) {
  if (sector === 'all') return true;
  return prospect.sector && prospect.sector.includes(sector);
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const filtered = PROSPECTS.filter(p => {
    const matchS = matchesSector(p, activeSector);
    const matchQ = !searchQuery ||
      (p.empresa && p.empresa.toLowerCase().includes(searchQuery)) ||
      (p.sector && p.sector.toLowerCase().includes(searchQuery)) ||
      (p.decisor && p.decisor.toLowerCase().includes(searchQuery));
    return matchS && matchQ;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state"><h3>Sin resultados</h3><p>Prueba con otro filtro o búsqueda.</p></div>`;
    return;
  }

  // Sort by date desc
  const sorted = [...filtered].sort((a, b) => b.fecha.localeCompare(a.fecha));

  grid.innerHTML = sorted.map((p, i) => {
    const color = getSectorColor(p.sector);
    const estadoClass = getEstadoClass(p.estado);
    const hasLinkedIn = p.linkedin && p.linkedin.startsWith('http');
    const hasEmail = p.email && p.email.includes('@') && !p.email.includes('no encontrado') && !p.email.includes('Ver ');
    const hasMensaje = p.mensaje && p.mensaje.length > 10;

    return `
    <div class="card">
      <div class="card-header">
        <div class="card-top">
          <span class="card-fecha">${p.fecha}</span>
          <span class="card-estado ${estadoClass}">${p.estado || 'Pendiente'}</span>
        </div>
        <div class="card-empresa">${p.empresa}</div>
        <span class="sector-badge" style="background:${color}">${p.sector}</span>
      </div>
      <div class="card-body">
        ${p.descripcion ? `<p class="card-desc">${p.descripcion}</p>` : ''}
        ${p.porQueFit ? `<div><div class="fit-label">¿Por qué fit?</div><p class="card-fit">${p.porQueFit}</p></div>` : ''}
        <div class="card-divider"></div>
        <div class="decisor-block">
          <span class="decisor-name">${p.decisor || '—'}</span>
          <span class="decisor-cargo">${p.cargo || ''}</span>
          <div class="decisor-links">
            ${hasLinkedIn ? `<a href="${p.linkedin}" target="_blank" class="link-btn link-li">↗ LinkedIn</a>` : `<span class="no-link">LinkedIn: no encontrado</span>`}
            ${hasEmail ? `<a href="mailto:${p.email.split(' ')[0]}" class="link-btn link-em">✉ Email</a>` : ''}
          </div>
        </div>
        ${hasMensaje ? `
        <div class="card-divider"></div>
        <div class="mensaje-block">
          <div class="mensaje-label">✉ Mensaje listo</div>
          <p class="mensaje-text">${p.mensaje}</p>
        </div>
        <button class="copy-btn" onclick="copyMsg(this, \`${p.mensaje.replace(/`/g,'\\`')}\`)">Copiar mensaje</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

function copyMsg(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copiado';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copiar mensaje'; btn.classList.remove('copied'); }, 2000);
  });
}

function updateStats() {
  document.getElementById('stat-total').textContent = PROSPECTS.length;
  document.getElementById('stat-pending').textContent = PROSPECTS.filter(p => !p.estado || p.estado === 'Pendiente').length;
  document.getElementById('stat-contacted').textContent = PROSPECTS.filter(p => p.estado && p.estado.toLowerCase().includes('contactado')).length;
}

// Init
buildSectorPills();
updateStats();
renderCards();
</script>
